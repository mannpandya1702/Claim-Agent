<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Observe Insurance claims assistant: ops dashboard and call page." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Observe Claims Ops</title>
    <script>
      // Apply a stored theme before first paint so there is no light flash in dark mode.
      try {
        var t = localStorage.getItem("observe-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
