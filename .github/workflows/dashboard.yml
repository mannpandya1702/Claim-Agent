name: Dashboard

# Builds the ops dashboard and publishes it to GitHub Pages
# (https://mannpandya1702.github.io/Claim-Agent/).
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one but never cancels a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          # Repository variables override the committed .env.production when they are set.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPI_PUBLIC_KEY: ${{ vars.VITE_VAPI_PUBLIC_KEY }}
          VITE_ASSISTANT_CORE_ID: ${{ vars.VITE_ASSISTANT_CORE_ID }}
          VITE_ASSISTANT_SOLO_ID: ${{ vars.VITE_ASSISTANT_SOLO_ID }}
          VITE_SQUAD_ID: ${{ vars.VITE_SQUAD_ID }}
          VITE_PHONE_NUMBER: ${{ vars.VITE_PHONE_NUMBER }}
        run: |
          # An unset repository variable arrives as an empty string, and Vite lets the process
          # environment win over .env files, so drop empties to keep the committed values.
          for v in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_VAPI_PUBLIC_KEY VITE_ASSISTANT_CORE_ID \
                   VITE_ASSISTANT_SOLO_ID VITE_SQUAD_ID VITE_PHONE_NUMBER; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
